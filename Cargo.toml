[package]
name = "neo-solidity"
version = "0.17.0"
edition = "2021"
rust-version = "1.82"
description = "Production-ready Solidity-to-NeoVM compilation system"
license = "MIT"
repository = "https://github.com/r3e-network/neo-solidity"
homepage = "https://github.com/r3e-network/neo-solidity"
documentation = "https://docs.r3e.network/neo-solidity"
authors = ["Jimmy <jimmy@r3e.network>"]
keywords = ["neo", "solidity", "blockchain", "smart-contracts", "neovm", "compiler"]
categories = ["compilers", "development-tools", "cryptography"]
readme = "README.md"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1.0"
once_cell = "1.0"
dashmap = "5.0"
rayon = "1.7"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
ripemd = "0.1"
secp256k1 = { version = "0.27", features = ["recovery"] }
num-bigint = "0.4"
num-traits = "0.2"
solang-parser = { package = "foundry-solang-parser", version = "0.3.9" }
# `stacker` wraps recursive compiler entry points (`lower_expression`,
# `lower_statement`, etc.) to grow the call stack on demand instead of
# stack-overflowing on pathological nesting (e.g. `(((((...)))))` or
# `{{{{{{...}}}}}}` ~10k+ deep). See `src/ir/expressions/dispatch/entry.rs`
# and the "Recent bug class" section in docs/FUZZ.md.
stacker = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.0"
quickcheck = "1.0"
tempfile = "3.0"
pretty_assertions = "1.0"
# Reference oracle for differential testing of CryptoLib.murmur32 against
# the in-runtime murmur3_x86_32 implementation. See
# tests/fuzz_tests/differential.rs::differential_cryptolib_murmur32.
murmur3 = "0.5"
# Reference oracle for differential testing of CryptoLib.bls12381* G1/G2 curve
# operations against the runtime path. See
# tests/fuzz_tests/differential.rs::differential_bls12381_*.
# Note: at the time of writing, the runtime stub at
# src/runtime/execution/execution_impl_part2_native/crypto.rs falls through to
# StackItem::Null for every bls12381* method, so the differential tests run in
# "partial-implementation" mode: they assert success-or-stub but skip
# byte-equality assertions until the runtime implementation lands. They will
# start enforcing equality automatically once the runtime returns real point
# data.
bls12_381 = "0.8"
# Transitive of bls12_381; re-imported in differential tests for the
# `Group::generator()` trait fn used by the bls12381_g1/g2 proptests.
group = "0.13"
# Reference oracle for differential testing of StdLib.base64Encode/Decode
# against the in-runtime hand-rolled RFC 4648 codec
# (src/runtime/execution/execution_impl_part2_native/stdlib.rs::base64_encode).
# See tests/fuzz_tests/stdlib_native_props.rs.
base64 = "0.21"
# Reference oracle for differential testing of StdLib.base58Encode/Decode
# (Bitcoin/IPFS-style alphabet — currently unimplemented in the runtime,
# so the harness pins the documented "fall through to Null" contract until
# the native lands; see Task #51 follow-up).
bs58 = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

[[bin]]
name = "neo-solc"
path = "src/main.rs"

[lints.rust]
unused_must_use = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Targeted checks
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "allow"
uninlined_format_args = "warn"
# Allow patterns common in this codebase
map_unwrap_or = "allow"
semicolon_if_nothing_returned = "allow"
unused_self = "allow"
