name: Documentation
true:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  docs-build:
    name: Build Docs Site
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install Node dependencies
      run: npm install
    - name: Generate Rust API docs
      run: 'cargo doc --no-deps --document-private-items

        rm -rf docs/public/api/rust

        mkdir -p docs/public/api/rust

        cp -r target/doc/* docs/public/api/rust/

        '
    - name: Generate TypeScript API docs
      run: bash scripts/generate_ts_docs.sh
    - name: Generate C# API docs
      run: bash scripts/generate_cs_docs.sh
    - name: Build VitePress site
      run: npm run docs:build
    - name: Configure GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v5
    - name: Upload Pages artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/.vitepress/dist
    timeout-minutes: 15
  docs-deploy:
    name: Deploy Docs Site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
    timeout-minutes: 15
