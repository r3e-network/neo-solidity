name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build release binary
        run: cargo build --release

      - name: Compile smoke contract
        run: |
          ./target/release/neo-solc examples/ERC20Token.sol -o SmokeERC20 -v
          test -f SmokeERC20.nef
          test -f SmokeERC20.manifest.json

      - name: Validate emitted artifacts
        run: |
          MAGIC=$(xxd -l 4 -p SmokeERC20.nef)
          test "$MAGIC" = "4e454633"
          python3 -c "import json; d=json.load(open('SmokeERC20.manifest.json')); assert d.get('name'); assert 'abi' in d; assert 'permissions' in d"
